<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .logo-bg { fill: url(#gradLight); }
      .logo-pen { fill: url(#penLight); }
      @media (prefers-color-scheme: dark) {
        .logo-bg { fill: url(#gradDark); }
        .logo-pen { fill: url(#penDark); }
      }
    </style>
    <linearGradient id="gradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="gradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="penLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="penDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="14" y="14" width="100" height="100" rx="22" class="logo-bg" filter="url(#shadow)"/>

  <!-- Icon: Stylized Graduation Cap / Book -->
  <g transform="translate(64, 64) scale(0.62)">
    <!-- Book Base -->
    <path d="M-40 10 Q -40 30, 0 35 Q 40 30, 40 10 L 40 -10 Q 0 -5, -40 -10 Z" fill="white" opacity="0.95"/>
    <!-- Pages -->
    <path d="M-35 12 Q -35 28, 0 32 Q 35 28, 35 12" stroke="white" stroke-width="3.5" fill="none" opacity="0.75"/>
    <!-- Pen Tip Overlay -->
    <path d="M0 -30 L 15 0 L 0 40 L -15 0 Z" class="logo-pen"/>
    <circle cx="0" cy="-30" r="5.5" fill="white"/>
  </g>
</svg>
